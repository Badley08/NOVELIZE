name: Android Build

on:
  push:
    branches: ["main", "v2.0"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "v2.0"]
  workflow_dispatch:

jobs:
  build:
    name: Build and Sign Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ runner.temp }}/novelize-release.jks

      - name: Build and sign release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/novelize-release.jks
          KEYSTORE_STORE_PASS: ${{ secrets.KEYSTORE_STORE_PASS }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASS }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Remove keystore from runner
        if: always()
        run: rm -f ${{ runner.temp }}/novelize-release.jks

      - name: Rename APK and extract version
        id: get_version
        run: |
          VERSION=$(grep versionName app/build.gradle.kts | grep -oP '"[^"]+"' | tr -d '"')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          RELEASE_APK=$(find app/build/outputs/apk/release/ -type f -name "*.apk" ! -name "*-unsigned.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            RELEASE_APK=$(find app/build/outputs/apk/release/ -type f -name "*.apk" | head -n 1)
          fi
          echo "Found release APK: $RELEASE_APK"
          cp "$RELEASE_APK" "app/build/outputs/apk/release/Novelize-${VERSION}-signed.apk"

      - name: Publish GitHub Release with direct APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v2.0' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.get_version.outputs.version) }}
          name: NoveLize v${{ steps.get_version.outputs.version }}
          files: app/build/outputs/apk/release/Novelize-*.apk
          generate_release_notes: false
          body: "NoveLize v2.1 - Native Android architecture with 4 optimized TTS voice presets, custom book covers (PDF/EPUB/DOCX), favorite bookshelf, and smart independent reading position tracking."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKFLOW_ID=$(gh api repos/${{ github.repository }}/actions/workflows \
            --jq '.workflows[] | select(.name == "Android Build") | .id')

          OLD_RUNS=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/${WORKFLOW_ID}/runs?per_page=100" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .[10:] | .[].id')

          for RUN_ID in $OLD_RUNS; do
            echo "Deleting run $RUN_ID"
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/${RUN_ID}" || true
          done
