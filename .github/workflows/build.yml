name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Sign Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Decode the base64-encoded keystore stored as a GitHub secret and write
      # it to a temporary path that is never persisted in the repository.
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ runner.temp }}/novelize-release.jks

      - name: Build and sign release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/novelize-release.jks
          KEYSTORE_STORE_PASS: ${{ secrets.KEYSTORE_STORE_PASS }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASS }}
        run: ./gradlew assembleRelease --no-daemon

      # Remove the keystore from the runner immediately after the build so it
      # does not linger in the runner's temp directory.
      - name: Remove keystore from runner
        if: always()
        run: rm -f ${{ runner.temp }}/novelize-release.jks

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: novelize-release-signed
          path: app/build/outputs/apk/release/app-universal-release.apk
