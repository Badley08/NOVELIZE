name: Android Build

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Sign Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write        # required to delete old workflow runs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Decode the base64-encoded keystore stored as a GitHub secret.
      # The file is written to a temp path that is never persisted in the repo.
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ runner.temp }}/novelize-release.jks

      - name: Build and sign release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/novelize-release.jks
          KEYSTORE_STORE_PASS: ${{ secrets.KEYSTORE_STORE_PASS }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASS }}
        run: ./gradlew assembleRelease --no-daemon

      # Wipe keystore from runner immediately after build.
      - name: Remove keystore from runner
        if: always()
        run: rm -f ${{ runner.temp }}/novelize-release.jks

      # Rename APK to a clean human-readable filename before publishing.
      # The universal APK produced by Gradle is app-universal-release.apk.
      - name: Rename APK and extract version
        id: get_version
        run: |
          VERSION=$(grep versionName app/build.gradle.kts | grep -oP '"[^"]+"' | tr -d '"')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          mv app/build/outputs/apk/release/app-universal-release.apk \
             app/build/outputs/apk/release/Novelize-${VERSION}-signed.apk

      # Publish GitHub Release with direct APK asset (no ZIP archive).
      # This allows NoveLize's in-app UpdateManager to fetch the raw APK and install seamlessly.
      - name: Publish GitHub Release with direct APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.get_version.outputs.version) }}
          name: NoveLize v${{ steps.get_version.outputs.version }}
          files: app/build/outputs/apk/release/Novelize-*.apk
          generate_release_notes: false
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keep the APK as an uncompressed workflow artifact as backup
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Novelize-signed
          path: app/build/outputs/apk/release/Novelize-*.apk
          compression-level: 0

      # Delete stale workflow runs to keep the Actions tab clean.
      # Retains the 10 most recent runs regardless of status.
      - name: Delete old workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKFLOW_ID=$(gh api repos/${{ github.repository }}/actions/workflows \
            --jq '.workflows[] | select(.name == "Android Build") | .id')

          OLD_RUNS=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/${WORKFLOW_ID}/runs?per_page=100" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .[10:] | .[].id')

          for RUN_ID in $OLD_RUNS; do
            echo "Deleting run $RUN_ID"
            gh api -X DELETE "repos/${{ github.repository }}/actions/runs/${RUN_ID}" || true
          done
